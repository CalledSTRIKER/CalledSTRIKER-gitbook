name: Sync Owned Machines

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests Pillow cairosvg

      - name: Run sync script
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
          HTB_PROFILE_ID: ${{ secrets.HTB_PROFILE_ID }}
          THM_USER_ID: ${{ secrets.THM_USER_ID }}
        run: python sync_owned.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ state.json README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync owned machines [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
